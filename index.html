<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatoria Temática Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1E6; --surface:#FFFFFF; --ink:#1C2B22; --muted:#56655B;
  --panel:#1F4030; --on-panel:#F4F1E8; --accent:#1F4030; --gold:#C9951A; --line:#D2D6C6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1914; --surface:#1A2921; --ink:#ECE8DA; --muted:#A3B0A6;
    --panel:#2A4636; --on-panel:#F1EDE0; --accent:#9AD0AD; --gold:#E0B040; --line:#2C3F34;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1914; --surface:#1A2921; --ink:#ECE8DA; --muted:#A3B0A6;
  --panel:#2A4636; --on-panel:#F1EDE0; --accent:#9AD0AD; --gold:#E0B040; --line:#2C3F34;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.38}
.app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font:inherit;font-size:13px;font-weight:600;line-height:1.2;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--panel);color:var(--on-panel);border-color:var(--panel)}
.bar{display:flex;gap:3px;margin:8px 0 2px}
.bar button{flex:1;height:14px;padding:5px 0;border:0;background:transparent;cursor:pointer}
.bar button.gap{margin-left:7px}
.bar i{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:20px;line-height:1.2;font-weight:700;
  color:var(--accent);margin:6px 0 2px;min-height:1.2em}
.stage{flex:1;min-height:180px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;right:4px;bottom:2px;margin:0;font-size:12px;color:var(--muted);pointer-events:none}
.cap{margin:4px 0 10px;padding-top:8px;border-top:1px solid var(--line);font-size:15px;min-height:7em}
.ctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.ctl button{font:inherit;font-weight:600;font-size:15px;padding:11px 8px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
.ctl #play{background:var(--panel);color:var(--on-panel);border-color:var(--panel)}
.ctl button:disabled{opacity:.4;cursor:default}
@media (min-width:640px){
  body{font-size:17px} h1{font-size:26px} .cap{font-size:18px;min-height:4.6em} .tabs button{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" aria-label="Capítulos">
    <button type="button" data-go="0">Do que se trata</button>
    <button type="button" data-go="5">O que já foi feito</button>
    <button type="button" data-go="10">O que se pretende fazer</button>
  </nav>
  <div class="bar" id="bar" aria-label="Cenas"></div>
  <h1 id="ttl"></h1>
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Maquete tridimensional animada do território e do trabalho da relatoria temática"></canvas>
    <p class="hint">Arraste para girar</p>
  </div>
  <p class="cap" id="cap" aria-live="polite"></p>
  <div class="ctl">
    <button type="button" id="prev">Voltar</button>
    <button type="button" id="play">Pausar</button>
    <button type="button" id="next">Avançar</button>
  </div>
</div>
<script>
(function(){
'use strict';
/* ---------- roteiro ---------- */
var SC=[
 {ch:0,d:10,title:'Um território, três temas',
  cap:'Floresta e rio, cidade, encosta sujeita a chuva forte: o mesmo território reúne três temas que o TCE/SC acompanha de forma permanente.'},
 {ch:0,d:13,title:'Os três temas',
  cap:'Meio ambiente, ocupação do solo e prevenção de desastres andam juntos: o modo como a cidade cresce pressiona a natureza e define quem fica exposto a enchentes e deslizamentos.'},
 {ch:0,d:14,title:'O que é a relatoria temática',
  cap:'Na relatoria temática, um Conselheiro é o titular de um assunto e o acompanha como um todo, de forma contínua. As três relatorias, consolidadas em 2024, têm um só titular: o Conselheiro José Nei Ascari.'},
 {ch:0,d:13,title:'Quem trabalha com o relator',
  cap:'O relator supervisiona o Grupo TCE Meio Ambiente: nove servidores do gabinete e de cinco diretorias (DGCE, DLC, DAE, DEC e DGO), sob a coordenação de Ana Sophia.'},
 {ch:0,d:14,title:'Como o trabalho funciona',
  cap:'O método é o Programa TCE Meio Ambiente, de 2025: as diretorias fiscalizam de forma articulada, os dados alimentam as análises com apoio de tecnologia e inteligência artificial, e o acompanhamento segue de um ano para o outro.'},

 {ch:1,d:15,title:'Feito: prevenção de desastres',
  cap:'O Tribunal mediu o preparo da defesa civil dos municípios em 2023 e 2026, inspecionou 22 deles, abriu os dados em um painel público e prepara orientações sobre o El Niño, com julgamento previsto para 02/12/2026.'},
 {ch:1,d:16,title:'Feito: ocupação do solo',
  cap:'O foco é o Plano Diretor, a lei que orienta o crescimento da cidade. Os 295 municípios foram auditados. Dos 266 obrigados a ter plano, 169 estão em dia, 74 não fizeram a revisão periódica e 23 não têm plano.'},
 {ch:1,d:13,title:'Feito: meio ambiente',
  cap:'Além do saneamento, há quatro frentes com levantamentos e auditorias: políticas de clima, gestão dos recursos hídricos, licenciamento ambiental e os indicadores do IBS Ambiental.'},
 {ch:1,d:15,title:'Saneamento básico: o problema',
  cap:'É a pauta mais extensa, com oito temas. Um dado explica a prioridade: de cada 100 municípios catarinenses, 52 não têm sistema público centralizado de esgoto. Daí o foco em esgotamento sanitário e resíduos sólidos.'},
 {ch:1,d:15,title:'Saneamento básico: o que foi feito',
  cap:'A atuação foi dupla. Fora dos processos: painel de dados, seminário, cartilha e reuniões com todas as agências reguladoras. Nos processos: levantamentos, inspeções em agências e fiscalização ordenada de aterros e lixões.'},

 {ch:2,d:13,title:'A fazer: desastres e clima',
  cap:'Para 2027 e 2028, a ideia central é dar continuidade. Aqui: atualizar o diagnóstico da defesa civil, acompanhar os 14 municípios que não cumpriram as orientações ou regrediram e divulgar a Nota Técnica.'},
 {ch:2,d:12,title:'A fazer: solo e meio ambiente',
  cap:'Manter a cobrança sobre os 97 municípios com Plano Diretor irregular e dar sequência aos processos de licenciamento ambiental e à auditoria de recursos hídricos.'},
 {ch:2,d:14,title:'A fazer: saneamento básico',
  cap:'Acompanhar a regionalização dos serviços, inspecionar os 9 municípios em situação mais crítica nos planos municipais, abrir novos processos de esgoto conforme o ranking e autuar os de resíduos já determinados pelo Plenário.'},
 {ch:2,d:13,title:'Oportunidades novas',
  cap:'Avaliar o uso das ferramentas GUIA e VIGIA no tema, levar eventos pelo Estado, criar um painel público de Planos Diretores e acompanhar políticas ainda em construção, como o Plano Estadual de Saneamento, que SC não possui.'},
 {ch:2,d:16,title:'O calendário',
  cap:'Os marcos: última reunião do Grupo sob a atual supervisão ainda em 2026; relatório de atividades no início de 2027; prazo final da regionalização em 31/12/2027; e, no horizonte, a meta de universalização de 2033.'}
];
var acc=0; SC.forEach(function(s){s.t0=acc;acc+=s.d;}); var TOTAL=acc;
function st(i){return SC[i].t0;}

/* ---------- utilidades ---------- */
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function ease(x){x=clamp(x,0,1);return x*x*(3-2*x);}
function ramp(T,t0,d){return ease((T-t0)/d);}
function win(T,a,b,fi,fo){return ramp(T,a,fi||.7)*(1-ramp(T,b,fo||.6));}
var seed=7; function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
var FOREVER=1e9;

/* ---------- geometria ---------- */
var objs=[], sprites=[], tags=[];
function O(p,vis,grow){var o={p:p,vis:vis==null?1:vis,grow:grow||'y',faces:[],layer:2};objs.push(o);return o;}
function face(o,v,c,a){o.faces.push({v:v,c:c,l:o.layer,a:a==null?1:a});}
function box(o,x,y,z,w,h,d,c,ct){var x1=x+w,y1=y+h,z1=z+d,
  A=[x,y,z],B=[x1,y,z],C=[x1,y,z1],D=[x,y,z1],E=[x,y1,z],F=[x1,y1,z],G=[x1,y1,z1],H=[x,y1,z1];
  face(o,[E,H,G,F],ct||c);face(o,[D,C,G,H],c);face(o,[B,A,E,F],c);face(o,[C,B,F,G],c);face(o,[A,D,H,E],c);}
function cbox(o,cx,y,cz,w,h,d,c,ct){box(o,cx-w/2,y,cz-d/2,w,h,d,c,ct);}
function pyr(o,cx,y,cz,w,h,c){var a=w/2,A=[cx-a,y,cz-a],B=[cx+a,y,cz-a],C=[cx+a,y,cz+a],D=[cx-a,y,cz+a],P=[cx,y+h,cz];
  face(o,[D,C,P],c);face(o,[C,B,P],c);face(o,[B,A,P],c);face(o,[A,D,P],c);}
function hexp(o,cx,y,cz,r,h,c,ct){var b=[],t=[],k;for(k=0;k<6;k++){var an=k*Math.PI/3;b.push([cx+r*Math.cos(an),y,cz+r*Math.sin(an)]);t.push([cx+r*Math.cos(an),y+h,cz+r*Math.sin(an)]);}
  for(k=0;k<6;k++){var n=(k+1)%6;face(o,[b[n],b[k],t[k],t[n]],c);}
  face(o,[t[5],t[4],t[3],t[2],t[1],t[0]],ct||c);}
function prism(o,x0,x1,y,h,zf,zb,c){var xm=(x0+x1)/2;
  face(o,[[x0,y,zf],[x1,y,zf],[xm,y+h,zf]],c);
  face(o,[[x1,y,zb],[x0,y,zb],[xm,y+h,zb]],c);
  face(o,[[x0,y,zf],[xm,y+h,zf],[xm,y+h,zb],[x0,y,zb]],c);
  face(o,[[x1,y,zf],[x1,y,zb],[xm,y+h,zb],[xm,y+h,zf]],c);}
function flat(o,x0,z0,x1,z1,y,c,a){face(o,[[x0,y,z0],[x0,y,z1],[x1,y,z1],[x1,y,z0]],c,a);}

var GRASS=[146,188,124],G2=[118,166,104],G3=[92,146,88],TREE=[52,112,74],TREE2=[70,132,84],EARTH=[128,100,74],
    WATER=[78,150,200],STONE=[232,226,208],WHITE=[248,244,232],GOLD=[214,162,34],ROOF=[182,92,58],WALL=[244,234,212],
    GRAY=[168,168,156],ROAD=[120,124,120],OKC=[62,142,96],WARN=[196,90,52],BLUE=[66,134,178],NEUT=[214,208,190],CLOUD=[226,230,234],DARK=[70,82,76];

function slab(cx,cz,w,d,top,vis){var o=O([cx,0,cz],vis,'u');o.layer=0;cbox(o,0,-1,0,w,1,d,EARTH,top||GRASS);return o;}
function house(x,y,z,vis,wall,roof,s){s=s||1;var o=O([x,y,z],vis,'u');cbox(o,0,0,0,.8*s,.55*s,.8*s,wall||WALL);pyr(o,0,.55*s,0,.98*s,.5*s,roof||ROOF);return o;}
function tree(x,y,z,vis,s){s=s||1;var o=O([x,y,z],vis,'u');cbox(o,0,0,0,.14*s,.3*s,.14*s,EARTH);pyr(o,0,.3*s,0,.72*s,.75*s,rnd()>.5?TREE:TREE2);pyr(o,0,.72*s,0,.52*s,.62*s,TREE2);return o;}
function cloud(x,y,z,vis,s){s=s||1;var sh=O([x,0,z],vis,'u');sh.layer=1;flat(sh,-1.5*s,-.9*s,1.5*s,.9*s,.05+y*.0,[30,50,40],.22);sh.p=[x,(y>3?.0:0),z];
  var o=O([x,y,z],vis,'u');cbox(o,0,0,0,2.6*s,.6*s,1.5*s,[150,160,174],[176,186,198]);cbox(o,-.5*s,.6*s,.1*s,1.4*s,.6*s,1.1*s,[176,186,198],[214,220,228]);cbox(o,.7*s,.6*s,-.1*s,1.1*s,.4*s,.9*s,[164,174,188],[200,208,218]);cbox(o,-1.5*s,.1*s,0,.6*s,.4*s,.9*s,[164,174,188]);return o;}
function pawn(col,pf,vis){var o=O([0,0,0],vis,'u');o.pf=pf;pyr(o,0,0,0,.36,.6,col);
  sprites.push({k:'c',pf:function(T){var p=pf(T);return [p[0],p[1]+.72,p[2]];},r:.15,c:col,vis:vis});return o;}
function pin(x,y,z,h,t0,t1,col){sprites.push({k:'pin',p:[x,y,z],h:h,c:col||GOLD,vis:function(T){return win(T,t0,t1);}});}
function tag(text,p,t0,t1){tags.push({text:text,p:p,t0:t0,t1:t1});}
function arcPt(a,b,lift,u){var mx=(a[0]+b[0])/2,my=Math.max(a[1],b[1])+lift,mz=(a[2]+b[2])/2,v=1-u;
  return [v*v*a[0]+2*v*u*mx+u*u*b[0],v*v*a[1]+2*v*u*my+u*u*b[1],v*v*a[2]+2*v*u*mz+u*u*b[2]];}

/* ===== A: o território (origem 0,0,0) ===== */
slab(0,0,22,14);
(function(){
  var o=O([0,0,0]);
  cbox(o,-7.5,0,-1,6,.6,9,G2);cbox(o,-7.8,.6,-1.3,4,.6,6,G3);cbox(o,-8,1.2,-1.6,2.2,.6,3,[80,132,82]);
  // rio
  var r=O([0,0,0]);r.layer=1;var P=[[-4.6,-1.8],[-2.5,1],[.5,3.2],[1.2,7]],i;
  for(i=0;i<P.length-1;i++){var a=P[i],b=P[i+1],dx=b[0]-a[0],dz=b[1]-a[1],L=Math.sqrt(dx*dx+dz*dz),nx=-dz/L*.5,nz=dx/L*.5;
    face(r,[[a[0]-nx,.02,a[1]-nz],[a[0]+nx,.02,a[1]+nz],[b[0]+nx,.02,b[1]+nz],[b[0]-nx,.02,b[1]-nz]],WATER);}
  function nearRiver(x,z){for(var i=0;i<P.length-1;i++){var a=P[i],b=P[i+1],t=clamp(((x-a[0])*(b[0]-a[0])+(z-a[1])*(b[1]-a[1]))/((b[0]-a[0])*(b[0]-a[0])+(b[1]-a[1])*(b[1]-a[1])),0,1),
    px=a[0]+t*(b[0]-a[0]),pz=a[1]+t*(b[1]-a[1]);if((x-px)*(x-px)+(z-pz)*(z-pz)<1)return true;}return false;}
  function hy(x,z){if(Math.abs(x+8)<1.1&&Math.abs(z+1.6)<1.5)return 1.8;if(Math.abs(x+7.8)<2&&Math.abs(z+1.3)<3)return 1.2;if(Math.abs(x+7.5)<3&&Math.abs(z+1)<4.5)return .6;return 0;}
  var n=0,g=0;while(n<40&&g++<400){var x=-10.6+rnd()*8.2,z=-6.4+rnd()*12.8;
    if(nearRiver(x,z))continue; if(x>-3.6&&z<-2.6)continue;
    (function(x,z,d){tree(x,hy(x,z),z,function(T){return ramp(T,d,.7);},.8+rnd()*.5);})(x,z,.3+rnd()*2.6);n++;}
  // cidade
  var xs=[3.4,4.8,6.2,7.6,9],zs=[-5.2,-3.8,-2.4,-1,.4];
  xs.forEach(function(x){zs.forEach(function(z){if(rnd()<.14)return;var d=.6+rnd()*2.6,big=rnd()<.25;
    house(x+rnd()*.2,0,z+rnd()*.2,function(T){return ramp(T,d,.7);},big?[226,220,206]:WALL,big?[110,122,134]:ROOF,big?1.25:1);});});
})();
// encosta de risco e nuvem
(function(){var o=O([0,0,0]);cbox(o,5.4,0,4.7,3.6,.9,2.6,[122,150,96]);
  [[4.4,.9,4.3],[5.6,.9,5.1],[6.5,.9,4.2]].forEach(function(p){house(p[0],p[1],p[2],function(T){return ramp(T,1.5,.8);},[236,214,186],[160,78,56],.85);});
  [[2.7,0,4.6],[2.4,0,3.2]].forEach(function(p){house(p[0],p[1],p[2],function(T){return ramp(T,1.8,.8);},[236,214,186],[160,78,56],.85);});
})();
var CL=[4.4,4.6,4.4];
cloud(CL[0],CL[1],CL[2],function(T){return ramp(T,st(1)+6.2,1.2);},1.15);
function raining(T){return Math.max(win(T,st(1)+7.4,st(2)+1,.8,1.5),win(T,st(5)-.5,st(6)+.5,1,1.5));}
(function(){for(var i=0;i<34;i++){(function(i){var ox=(rnd()-.5)*2.8,oz=(rnd()-.5)*1.7,ph=rnd();
  sprites.push({k:'rain',vis:raining,pf:function(T){var y=CL[1]-((T*1.5+ph)%1)*4.4;return [CL[0]+ox,y,CL[2]+oz];}});})(i);}})();
// cheia
(function(){var o=O([2.1,0,4.9],function(T){return win(T,st(5)+.8,st(6)+.5,4,1.5);},'u');o.layer=1;flat(o,-2,-2.1,2,2.1,.04,WATER,.82);})();
// sede do Tribunal
var BLD=[0,0,-5];
(function(){var o=O(BLD,function(T){return ramp(T,st(2)+.6,1.6);});
  cbox(o,0,0,0,4.4,.3,2.6,STONE);cbox(o,0,.3,-.3,3.6,1.5,1.6,WALL);
  [-1.6,-.96,-.32,.32,.96,1.6].forEach(function(x){cbox(o,x,.3,.85,.24,1.5,.24,WHITE);});
  cbox(o,0,1.8,0,4,.28,2.4,STONE);prism(o,-2,2,2.08,.8,1.2,-1.2,[222,214,192]);
})();
var RELP=[0,0,-3.3];
pawn(GOLD,function(){return RELP;},function(T){return ramp(T,st(2)+2.6,.8);});
tag('Meio ambiente',[-8,3,-1.6],st(1)+1,st(2)-.2);
tag('Ocupação do solo',[6.2,1.5,-2.4],st(1)+4,st(2)-.2);
tag('Prevenção de desastres',[4.4,5.9,4.4],st(1)+8,st(2)-.2);
tag('Relator temático',[0,1.1,-3.3],st(2)+3.4,st(3)-.2);
tag('Tribunal de Contas (TCE/SC)',[0,3,-5],st(2)+1.6,st(3)-.2);
// feixes: relator -> três temas
var TOPB=[0,2.9,-5], ZN=[[-8,2,-1.6],[6.2,.9,-2.4],[4.6,1.6,4.6]];
ZN.forEach(function(z,i){sprites.push({k:'arc',a:TOPB,b:z,lift:2.6,c:GOLD,
  prog:function(T){return ramp(T,st(2)+5.5+i*1.3,1.4);},vis:function(T){return 1-ramp(T,st(5)-1,1);}});
  for(var k=0;k<5;k++){(function(k){sprites.push({k:'c',r:.13,c:[255,236,170],
    vis:function(T){return win(T,st(4)+.8,st(5)-1.2,.8,.8);},
    pf:function(T){var u=((T*.28+k/5+i*.13)%1);return arcPt(z,TOPB,2.6,u);}});})(k);}
});
// mesa e grupo
(function(){var TB=[0,0,-1.7];var o=O(TB,function(T){return win(T,st(3)+.3,st(5)-.5,.9,.8);});hexp(o,0,0,0,.75,.32,[150,112,78],[176,134,92]);
  var cols=[[46,134,140],[46,134,140],[46,134,140],[104,96,170],[180,96,120],[84,150,84],[196,120,48],[196,120,48],[90,120,190]];
  cols.forEach(function(c,i){var an=-Math.PI/2+.5+(i/9)*(Math.PI*2-1),end=[TB[0]+Math.cos(an)*1.35,0,TB[2]+Math.sin(an)*1.35],
    sa=an+(rnd()-.5)*.6,start=[TB[0]+Math.cos(sa)*8,0,TB[2]+Math.sin(sa)*5+1.5],t0=st(3)+1+i*.55;

    if(d.k==='f'){ctx.beginPath();ctx.moveTo(d.pts[0],d.pts[1]);for(j=2;j<d.pts.length;j+=2)ctx.lineTo(d.pts[j],d.pts[j+1]);ctx.closePath();ctx.fillStyle=d.fill;ctx.fill();ctx.strokeStyle=d.fill;ctx.lineWidth=.8;ctx.stroke();}
    else if(d.k==='c'){ctx.beginPath();ctx.arc(d.x,d.y,Math.max(.5,d.r),0,6.2832);ctx.fillStyle=d.fill;ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(d.a[0],d.a[1]);ctx.lineTo(d.b[0],d.b[1]);ctx.strokeStyle=d.st;ctx.lineWidth=d.w;ctx.stroke();}}
  drawTags(T);
}
function wrap(text,maxW){var words=text.split(' '),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});lines.push(cur);return lines;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawTags(T){var fs=(W/dpr<520?12.5:15)*dpr,lh=fs*1.22,pad=7*dpr,placed=[],i,k;
  ctx.font='600 '+fs+'px "Source Sans 3",system-ui,sans-serif';ctx.textBaseline='middle';
  for(i=0;i<tags.length;i++){var g=tags[i],a=ramp(T,g.t0,.45)*(1-ramp(T,g.t1,.4));if(a<=.01)continue;var s=proj(g.p);if(!s)continue;
    if(!g.lines){g.lines=wrap(g.text,Math.min(W*.56,230*dpr));g.w=0;g.lines.forEach(function(l){g.w=Math.max(g.w,ctx.measureText(l).width);});}
    var w=g.w+pad*2,h=g.lines.length*lh+pad*1.2,x=clamp(s[0]-w/2,4,W-w-4),y=s[1]-h-18*dpr,up=true,guard=0,moved=true;
    if(y<4){y=s[1]+16*dpr;up=false;}
    while(moved&&guard++<24){moved=false;for(k=0;k<placed.length;k++){var r=placed[k];
      if(x<r.x+r.w+4&&x+w+4>r.x&&y<r.y+r.h+4&&y+h+4>r.y){y=up?r.y-h-5:r.y+r.h+5;moved=true;if(up&&y<4){up=false;y=s[1]+16*dpr;}}}}
    y=clamp(y,4,H-h-4);placed.push({x:x,y:y,w:w,h:h});
    ctx.globalAlpha=a;
    ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(clamp(s[0],x+8,x+w-8),y<s[1]?y+h:y);ctx.strokeStyle='rgba(24,48,36,.9)';ctx.lineWidth=1.6*dpr;ctx.stroke();
    ctx.beginPath();ctx.arc(s[0],s[1],3.4*dpr,0,6.2832);ctx.fillStyle='#E0B040';ctx.fill();ctx.strokeStyle='rgba(24,48,36,.9)';ctx.lineWidth=1.2*dpr;ctx.stroke();
    rr(x,y,w,h,7*dpr);ctx.fillStyle='rgba(27,56,42,.95)';ctx.fill();ctx.strokeStyle='rgba(244,241,232,.55)';ctx.lineWidth=1*dpr;ctx.stroke();
    ctx.fillStyle='#F6F2E6';for(k=0;k<g.lines.length;k++)ctx.fillText(g.lines[k],x+pad,y+pad*.6+lh*(k+.5));
    ctx.globalAlpha=1;}
}

/* ---------- controle ---------- */
var bar=document.getElementById('bar'),cap=document.getElementById('cap'),ttl=document.getElementById('ttl');
var bPlay=document.getElementById('play'),bPrev=document.getElementById('prev'),bNext=document.getElementById('next');
var tabs=[].slice.call(document.querySelectorAll('.tabs button'));
var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fills=SC.map(function(s,i){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Cena '+(i+1)+' de '+SC.length+': '+s.title);
  if(i>0&&s.ch!==SC[i-1].ch)b.className='gap';b.innerHTML='<i><b></b></i>';b.addEventListener('click',function(){go(i);});bar.appendChild(b);return b.querySelector('b');});
var T=0,idx=-1,playing=!reduced,posed=false,ended=false,last=null;
function sceneOf(t){var i=SC.length-1;while(i>0&&t<SC[i].t0)i--;return i;}
function paint(){var i=sceneOf(Math.min(T,TOTAL-.001));
  if(i!==idx){idx=i;cap.textContent=SC[i].cap;ttl.textContent=SC[i].title;tabs.forEach(function(t,k){t.setAttribute('aria-current',k===SC[i].ch?'true':'false');});
    bPrev.disabled=i===0;bNext.disabled=i===SC.length-1;}
  bPlay.textContent=ended?'Rever do início':(playing?'Pausar':'Reproduzir');
  fills.forEach(function(f,k){f.style.width=k<idx?'100%':(k>idx?'0%':clamp((T-SC[k].t0)/SC[k].d*100,0,100)+'%');});}
function go(i){i=clamp(i,0,SC.length-1);ended=false;yawOff=0;pitchOff=0;
  if(playing){T=SC[i].t0+(i===0?0:.01);posed=false;}else{T=SC[i].t0+SC[i].d*.82;posed=true;}paint();}
function toggle(){if(ended){ended=false;playing=true;posed=false;T=0;paint();return;}
  playing=!playing;if(playing&&posed){T=SC[idx].t0;posed=false;}paint();}
function tick(t){if(last===null)last=t;var dt=Math.min(.1,(t-last)/1000);last=t;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL-.01;playing=false;ended=true;}paint();}
  render(T);requestAnimationFrame(tick);}
bPlay.addEventListener('click',toggle);
bPrev.addEventListener('click',function(){go(idx-1);});
bNext.addEventListener('click',function(){go(idx+1);});
tabs.forEach(function(t){t.addEventListener('click',function(){go(+t.dataset.go);});});
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);else if(e.key===' '){e.preventDefault();toggle();}});
document.addEventListener('visibilitychange',function(){last=null;});
var drag=null;
cv.addEventListener('pointerdown',function(e){drag=[e.clientX,e.clientY];try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag)return;yawOff-=(e.clientX-drag[0])*.008;pitchOff=clamp(pitchOff+(e.clientY-drag[1])*.006,-.5,.7);drag=[e.clientX,e.clientY];});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null;});});
window.addEventListener('resize',resize);
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',readBG);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){tags.forEach(function(g){g.lines=null;});});
resize();if(!playing){T=SC[0].d*.82;posed=true;}paint();requestAnimationFrame(tick);
})();
</script>
